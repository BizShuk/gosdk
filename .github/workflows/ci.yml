name: Go CI

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    build:
        name: Build and Test
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"
                  cache: true

            - name: Install dependencies
              run: go mod download

            - name: Run Vet
              run: go vet ./...

            - name: Run Tests
              run: go test -v ./...

            - name: Build
              run: go build -v ./...
