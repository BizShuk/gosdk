# profile=local 時 viper 會載入這份 yaml。
# 任何鍵都可被 APP_ 前綴環境變數覆蓋，例如 APP_SERVER_PORT=9999。
server:
  host: 0.0.1.0 from config.local.yaml
  port: 1234

# DB 設定採扁平 viper key DB_DRIVER (mysql|sqlite) + DB_DSN,由 db.Init() 自行讀取。
# 額外連線以 suffix 區分:DB_DSN_<NAME> (+ 選填 DB_DRIVER_<NAME>),由 db.Open("<name>") 讀取。
DB_DRIVER: sqlite
DB_DSN: ./sample.db
